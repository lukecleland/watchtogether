<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable variant of icon.svg.

    Android crops an installed icon to whatever shape the launcher uses —
    circle, squircle, teardrop — keeping only the middle 80%. The main icon
    is drawn tight to its edges on purpose, so run through that crop it would
    lose the corners of both panels.

    Same mark, scaled to 0.68 about the centre so its furthest corner sits
    inside the safe circle (radius 205 of 512), with the background bled to
    the full frame to fill whatever the launcher keeps.
  -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1030" />
      <stop offset="0.22" stop-color="#1e3a8a" />
      <stop offset="0.38" stop-color="#3b5bd9" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="0.6" stop-color="#d946ef" />
      <stop offset="0.74" stop-color="#7c3aed" />
      <stop offset="0.88" stop-color="#2a2065" />
      <stop offset="1" stop-color="#0d1030" />
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#c4b5fd" stop-opacity="0.95" />
      <stop offset="0.7" stop-color="#f0abfc" stop-opacity="0.9" />
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#0f1330" />
      <stop offset="1" stop-color="#06060f" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <g transform="translate(256 256) scale(0.68) translate(-256 -256)">
    <!-- Back panel, upper left -->
    <rect x="26" y="58" width="272" height="272" rx="62" fill="url(#sweep)" />
    <rect
      x="26" y="58" width="272" height="272" rx="62"
      fill="none" stroke="url(#edge)" stroke-width="3"
    />
    <path
      d="M 106 152 L 192 194 L 106 236 Z"
      fill="#0a0b1e" stroke="#0a0b1e" stroke-width="18" stroke-linejoin="round"
      opacity="0.92"
    />

    <!-- Front panel, lower right -->
    <rect
      x="214" y="182" width="272" height="272" rx="62"
      fill="#06060f" stroke="none"
      transform="translate(-5,-5)" opacity="0.9"
    />
    <rect x="214" y="182" width="272" height="272" rx="62" fill="url(#sweep)" />
    <rect
      x="214" y="182" width="272" height="272" rx="62"
      fill="none" stroke="url(#edge)" stroke-width="3"
    />
    <path
      d="M 314 274 L 412 318 L 314 362 Z"
      fill="#0a0b1e" stroke="#0a0b1e" stroke-width="18" stroke-linejoin="round"
      opacity="0.92"
    />
  </g>
</svg>
